[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherbox"
version = "0.1.0"
description = "Local-first CLI secrets manager (plaintext Phase 1 prototype)"
requires-python = ">=3.11"
authors = [{ name = "cipherbox" }]
readme = "README.md"
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
]

[project.scripts]
vault = "cipherbox.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cipherbox*"]
